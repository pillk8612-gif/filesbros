<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>FileBox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    form { margin: 24px 0; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
    input[type=file] { display: block; margin-bottom: 12px; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    .code { font-size: 1.8rem; font-weight: 700; letter-spacing: 3px; background: #f1f5f9; padding: 14px 18px; border-radius: 10px; text-align: center; }
    .msg { padding: 10px; background: #fee2e2; border-radius: 8px; color: #991b1b; margin-bottom: 12px; }
    .admin-banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; padding: 15px; border-radius: 8px; margin-bottom: 20px; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <div id="adminText" class="admin-banner"></div>
  
  <h1>FileBox</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  {% if new_code %}
    <p>Файл загружен. Ваш код:</p>
    <div class="code">{{ new_code }}</div>
    <p><a href="{{ url_for('index') }}">Загрузить ещё</a></p>
  {% else %}
    <form method="post" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Загрузить и получить код</button>
    </form>
  {% endif %}

  <form method="post" action="{{ url_for('check_code') }}">
    <label>Введите код:</label><br><br>
    <input type="text" name="code" inputmode="numeric" pattern="\d{16}" maxlength="16" required style="width:100%;padding:10px;">
    <br><br>
    <button type="submit">Перейти к файлу</button>
  </form>
  
  <p style="text-align:center; margin-top:40px;"><a href="/admin" style="color:#94a3b8; text-decoration:none; font-size:0.9rem;">Вход для админа</a></p>

  <script>
    async function fetchAdminText() {
      try {
        const res = await fetch('/api/text');
        const data = await res.json();
        const banner = document.getElementById('adminText');
        if (data.text && data.text.trim() !== "") {
          banner.textContent = data.text;
          banner.style.display = 'block';
        } else {
          banner.style.display = 'none';
        }
      } catch (e) {}
    }
    fetchAdminText();
    setInterval(fetchAdminText, 3000);
  </script>
</body>
</html>
