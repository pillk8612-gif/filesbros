<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Скачать файл</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
    .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #2563eb; color: #fff; text-decoration: none; }
    .btn:hover { background: #1d4ed8; }
    .err { color: #991b1b; }
  </style>
</head>
<body>
  <h1>Файл по коду</h1>
  <div class="card">
    {% if found %}
      <p>Файл: <strong>{{ filename }}</strong></p>
      <a class="btn" href="{{ url_for('download_file', code=code) }}">Скачать</a>
    {% else %}
      <p class="err">Код не найден или истёк.</p>
      <p><a href="{{ url_for('index') }}">Вернуться на главную</a></p>
    {% endif %}
  </div>
</body>
</html>
